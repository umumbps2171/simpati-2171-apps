<script>
// ===== ISI DUA BARIS INI (Supabase > Project Settings > API) =====
const SB_URL='https://gqxmaebmujswfurhiijc.supabase.co/rest/v1/', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxeG1hZWJtdWpzd2Z1cmhpaWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNjI3OTAsImV4cCI6MjExMDczODc5MH0.IVr2qpyLTH0Zc07xmz3v2mfzJ2MUutVCrOjKhqXy1h4';
// =================================================================
const db=supabase.createClient(new URL(SB_URL.trim()).origin,SB_KEY.trim());
const J={
 surat_keluar:{t:'Surat Keluar',f:['tanggal','klasifikasi','perihal','tim','link'],c:['nomor','pembuat','tanggal','perihal','tim','link']},
 surat_tugas:{t:'Surat Tugas',f:['tanggal','klasifikasi','perihal','tim','link'],c:['nomor','pembuat','tanggal','perihal','tim','link']},

const IC={dashboard:sv('<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>'),
 surat_keluar:sv('<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>'),
 surat_tugas:sv('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'),
 sk_kpa:sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/>'),
 keuangan:sv('<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>'),
 form_permintaan:sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v6M9 15h6"/>'),
 pengajuan:sv('<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
 ruangan:sv('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4M8 15h3"/>'),

const GR=[['surat','Surat Menyurat',['surat_keluar','surat_tugas','sk_kpa']],['keuangan','Keuangan',['form_permintaan','pengajuan']]];
const nm=v=>J[v]?J[v].t:'Pengajuan Keuangan';
const TIM=['Umum','Sosial','Produksi','Nerwilis','Distribusi','IPDS'];
const lbl=k=>((J[view]||{}).lb||{})[k]||LB[k];
let me=null,view='dashboard',rows=[],page=1,q='',pg=[],kl=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canEdit=()=>['admin','petugas'].includes(me.role);
const hari=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
const tgl=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'';
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err show':'show';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3500)}
function modal(h,w){const m=$('#modal');m.innerHTML='<div class="box"'+(w?' style="max-width:'+w+'px"':'')+'>'+h+'</div>';m.hidden=false}
function closeM(){$('#modal').hidden=true}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};

async function boot(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){$('#app').hidden=true;$('#login').hidden=false;$('#gate').hidden=false;return}
 const {data:p}=await db.from('profiles').select('*').eq('id',session.user.id).single();
 me=p||{role:'pegawai',nama:session.user.email};
 const [a,b]=await Promise.all([db.from('pegawai').select('nama').eq('aktif',true).order('nama'),db.from('klasifikasi').select('*').order('kode')]);
 pg=a.data||[];kl=b.data||[];
 $('#login').hidden=true;$('#gate').hidden=true;$('#app').hidden=false;
 const ni=(v,t)=>`<a data-v="${v}">${IC[v]}<span>${t}</span>${v=='pengajuan'?'<em class="bd">Draft</em>':''}</a>`;
 $('#nav').innerHTML='<b><i><img src="logo-bps.png" alt="Logo BPS" onerror="noLogo(this)"></i><span>Umum BPS-2171<br>Super Apps</span></b>'+ni('dashboard','Dashboard')+GR.map(g=>`<div class="grp" data-k="${g[0]}"><a data-g="1">${IC[g[0]]}<span>${g[1]}</span><em>▾</em></a><div class="sub">${g[2].map(v=>ni(v,nm(v))).join('')}</div></div>`).join('')+ni('ruangan','Pemakaian Ruangan Rapat')+ni('pengaturan','Pengaturan')+`<span class="sp"></span><small class="out">${esc(me.nama)} (${me.role})</small><a class="out" id="keluar"><span>Keluar</span></a>`;
 $('#nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;if(a.id=='keluar'){db.auth.signOut().then(()=>location.reload())}else if(a.dataset.g){const g=a.closest('.grp');if(innerWidth<=800)document.querySelectorAll('.grp').forEach(x=>x!=g&&x.classList.remove('open'));g.classList.toggle('open')}else go(a.dataset.v)};
 document.addEventListener('click',e=>{if(innerWidth<=800&&!e.target.closest('.grp'))document.querySelectorAll('.grp').forEach(g=>g.classList.remove('open'))});
 go('dashboard');
}
$('#gb').onclick=()=>{const g=$('#gate');g.classList.add('open');setTimeout(()=>{g.hidden=true;$('#em').focus()},950)};

  if(u){const {error:e2}=await db.from('profiles').update({username:u}).ilike('email',e);if(e2){setelan();return toast('Pengguna ditambahkan, tetapi username "'+u+'" tidak bisa dipakai (mungkin sudah ada). Ubah di Daftar Pengguna.',1)}}
  toast('Pengguna ditambahkan. Username: '+(u||'-')+'. Kata sandi awal: 123456');setelan()};
 $('#un').onchange=()=>{$('#uu').value=usn($('#un').value)};
 $('#iu').onclick=async()=>{const n=await isiUsername();toast(n+' username diisi');setelan()};
 $('#main').querySelectorAll('[data-u]').forEach(i=>i.onchange=async()=>{const v=i.value.trim().toLowerCase();if(v&&!/^[a-z0-9._-]{3,}$/.test(v)){toast('Username minimal 3 karakter: huruf kecil, angka, titik, atau strip',1);return setelan()}
  const {error}=await db.from('profiles').update({username:v||null}).eq('id',i.dataset.u);if(error){toast(error.code=='23505'?'Username sudah dipakai pengguna lain':error.message,1);return setelan()}i.value=v;toast('Username diperbarui')});
 $('#main').querySelectorAll('[data-r]').forEach(s=>s.onchange=async()=>{const {error}=await db.rpc('ubah_peran',{p_id:s.dataset.r,p_role:s.value});error?(toast(error.message,1),setelan()):toast('Peran diperbarui')});
 $('#main').querySelectorAll('[data-n]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('profiles').update({nama:s.value}).eq('id',s.dataset.n);error?toast(error.message,1):toast('Nama pegawai diperbarui')});
 $('#main').querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{
  modal(`<h2>Reset Kata Sandi?</h2><p>Kata sandi <b>${esc(b.dataset.em)}</b> akan dikembalikan ke 123456.</p><div class="row"><button id="bt">Batal</button><button class="p" id="ok">Reset</button></div>`);
  $('#bt').onclick=closeM;
  $('#ok').onclick=async()=>{const {error}=await db.rpc('reset_sandi',{p_id:b.dataset.rs});closeM();error?toast(error.message,1):toast('Kata sandi dikembalikan ke 123456')}});
}
function draftPage(){
 $('#main').innerHTML=`<p class="muted" style="margin:0">Keuangan</p><h1>Pengajuan Keuangan <span class="chip" style="font-size:13px;vertical-align:middle;background:rgba(245,165,36,.2);color:#b36b00">Draft</span></h1>
 <div class="pn" style="max-width:720px"><h2>Menu Ini Masih Berupa Draft</h2><p class="muted">Belum ada fitur yang berfungsi di halaman ini. Alur dan isian pengajuan perlu dikonfirmasi dulu supaya sesuai kebutuhan kantor:</p>
 <ul style="line-height:1.9"><li>Isian apa saja yang dicatat (nomor, tanggal, uraian, nominal, tim, lampiran)?</li><li>Siapa yang menyetujui, dan berapa tahap persetujuannya?</li><li>Apakah pengajuan terhubung dengan nomor Form Permintaan?</li><li>Status apa saja yang dipakai (diajukan, disetujui, ditolak, dibayar)?</li><li>Siapa saja yang boleh melihat data keuangan?</li></ul></div>`}
const usn=n=>{const w=String(n||'').split(/[\s,]+/).map(x=>x.replace(/[^A-Za-z]/g,'')).filter(Boolean);return (w.find(x=>x.length>2&&!/^(dr|drs|dra|ir|prof|hj)$/i.test(x))||w[0]||'').toLowerCase()};
async function isiUsername(){
 const {data}=await db.from('profiles').select('id,nama,username'),us=data||[],pakai=new Set(us.filter(u=>u.username).map(u=>u.username.toLowerCase()));let n=0;
 for(const u of us.filter(u=>!u.username)){const b=usn(u.nama);if(!b)continue;let c=b,i=1;while(pakai.has(c))c=b+(++i);pakai.add(c);const {error}=await db.from('profiles').update({username:c}).eq('id',u.id);if(!error)n++}
 return n}
const RU=['Ruang Rapat','Ruang PST'];let rr=[];
const bolehRu=r=>me.role=='admin'||(!!me.id&&r.dibuat_oleh==me.id);
async function ruangPage(){
 $('#main').innerHTML='<p class="muted">Memuat…</p>';
 const {data,error}=await db.from('ruangan').select('*').order('tanggal',{ascending:false}).order('dibuat_pada',{ascending:false}).limit(5000);
 if(error)return toast('Gagal memuat data: '+error.message+' (pastikan patch SQL sudah dijalankan)',1);
 rr=data;ruangDraw()}
function ruangDraw(){
 const s=q.toLowerCase(),f=rr.filter(r=>!s||[r.tim,r.pegawai,r.ruangan,r.kegiatan,r.tanggal].join(' ').toLowerCase().includes(s)),tp=Math.max(1,Math.ceil(f.length/10));page=Math.min(page,tp);
 const part=f.slice((page-1)*10,page*10),C=[['tanggal','Tanggal Pemakaian'],['ruangan','Ruangan'],['kegiatan','Nama Kegiatan'],['tim','Tim Pembuat'],['pegawai','Nama Pegawai']];
 $('#main').innerHTML=`<p class="muted" style="margin:0">Fasilitas</p><h1>Pemakaian Ruangan Rapat</h1><div class="bar"><input id="cari" type="search" placeholder="Cari kegiatan, tim, ruangan…" value="${esc(q)}"><span class="sp"></span><button class="p" id="tambah">Ajukan Pemakaian</button></div>
 <div class="tw"><table><tr>${C.map(c=>`<th>${c[1]}</th>`).join('')}<th>Aksi</th></tr>${part.map(r=>`<tr>${C.map(c=>`<td data-l="${c[1]}">${c[0]=='tanggal'?tgl(r.tanggal):c[0]=='kegiatan'?'<b>'+esc(r.kegiatan)+'</b>':esc(r[c[0]])}</td>`).join('')}<td class="ac">${bolehRu(r)?`<button data-e="${r.id}">Ubah</button> <button class="d" data-x="${r.id}">Hapus</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">${s?'Tidak ada data yang cocok dengan pencarian.':'Belum ada pemakaian ruangan. Klik “Ajukan Pemakaian” untuk memulai.'}</td></tr>`}</table></div>
 <div class="pgn"><span class="muted">${f.length} data</span><button id="pv" ${page<2?'disabled':''}>Sebelumnya</button><span>${page} / ${tp}</span><button id="nx" ${page>=tp?'disabled':''}>Berikutnya</button></div>`;
 $('#cari').oninput=e=>{q=e.target.value;page=1;ruangDraw();const i=$('#cari');i.focus();i.setSelectionRange(q.length,q.length)};
 $('#tambah').onclick=()=>ruangForm();$('#pv').onclick=()=>{page--;ruangDraw()};$('#nx').onclick=()=>{page++;ruangDraw()};
 $('#main').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>ruangForm(b.dataset.e));
 $('#main').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ruangHapus(b.dataset.x));
}
function ruangForm(id){
 const r=id?rr.find(x=>x.id==id):{tanggal:hari(),pegawai:me.nama};
 const sel=(n,a,v,ph)=>`<select name="${n}" required><option value="">- ${ph} -</option>${a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 const nama=[...new Set([r.pegawai,...pg.map(p=>p.nama)])].filter(Boolean);
 modal(`<h2>${id?'Ubah':'Ajukan'} Pemakaian Ruangan Rapat</h2><form id="fm"><label>Tim Pembuat</label>${sel('tim',TIM,r.tim,'pilih tim')}
 <label>Nama Pegawai</label>${sel('pegawai',nama,r.pegawai,'pilih pegawai')}
 <label>Tanggal Pemakaian Ruangan</label><input name="tanggal" type="date" value="${esc(r.tanggal)}" required>
 <label>Ruangan yang Dipakai</label>${sel('ruangan',RU,r.ruangan,'pilih ruangan')}
 <label>Nama Kegiatan</label><input name="kegiatan" value="${esc(r.kegiatan)}" required autocomplete="off">
 <p id="hint" class="muted" style="font-size:13px;margin:12px 0 0">Semua isian wajib diisi.</p>
 <div class="row"><button type="button" id="bt">Batal</button><button class="p" type="submit">${id?'Simpan Perubahan':'Simpan'}</button></div></form>`);
 $('#bt').onclick=closeM;$('#fm').onsubmit=e=>ruangSave(e,id);
 const t=$('#fm [name=tanggal]'),ru=$('#fm [name=ruangan]'),hn=()=>{const b=rr.find(x=>x.id!=id&&x.tanggal==t.value&&x.ruangan==ru.value);
  $('#hint').textContent=b?ru.value+' sudah dipakai pada tanggal itu untuk “'+b.kegiatan+'” ('+b.tim+'). Pastikan jamnya tidak bentrok.':'Semua isian wajib diisi.'};
 t.onchange=ru.onchange=hn;
}
async function ruangSave(e,id){
 e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.kegiatan=(d.kegiatan||'').trim();
 if(['tim','pegawai','tanggal','ruangan','kegiatan'].some(k=>!d[k]))return toast('Semua isian wajib diisi',1);
 const b=e.submitter;b.disabled=true;
 const {error}=id?await db.from('ruangan').update(d).eq('id',id):await db.from('ruangan').insert(d);
 b.disabled=false;if(error)return toast('Gagal menyimpan: '+error.message,1);
 closeM();toast(id?'Perubahan disimpan':'Pemakaian ruangan tersimpan');ruangPage()}
function ruangHapus(id){
 const r=rr.find(x=>x.id==id);
 modal(`<h2>Hapus pemakaian ruangan?</h2><p><b>${esc(r.kegiatan)}</b> (${esc(r.ruangan)}, ${tgl(r.tanggal)}) akan dihapus.</p><div class="row"><button id="bt">Batal</button><button class="p" id="ok">Hapus</button></div>`);
 $('#bt').onclick=closeM;
 $('#ok').onclick=async()=>{const {error}=await db.from('ruangan').delete().eq('id',id);closeM();error?toast('Gagal menghapus: '+error.message,1):(toast('Data dihapus'),ruangPage())}}
const RL={admin:'admin',administrator:'admin',petugas:'petugas','petugas persuratan':'petugas',pegawai:'pegawai'};
function impor(a){
 const hd=(a[0]||[]).map(x=>String(x).toLowerCase()),ix=k=>hd.findIndex(x=>x.includes(k));
 let c=[ix('email'),ix('nama'),ix('role')>=0?ix('role'):ix('peran')];if(c.some(i=>i<0))c=[0,1,2];
 const ok=[],bad=[];
 a.slice(1).forEach((r,i)=>{if(!r.some(x=>String(x).trim()))return;
  const e=String(r[c[0]]).trim().toLowerCase(),n=String(r[c[1]]).trim(),rt=String(r[c[2]]).trim().toLowerCase()||'pegawai',ro=RL[rt];
  if(!/^\S+@\S+\.\S+$/.test(e))bad.push('Baris '+(i+2)+': email tidak valid');
  else if(!ro)bad.push('Baris '+(i+2)+': role "'+rt+'" tidak dikenal');
  else if(ok.some(x=>x.e==e))bad.push('Baris '+(i+2)+': email ganda di dalam file');
  else ok.push({e,n,ro})});
 if(!ok.length&&!bad.length)return toast('File kosong atau formatnya tidak sesuai template',1);
 modal(`<h2>Impor Pengguna</h2><p><b>${ok.length}</b> pengguna siap ditambahkan dengan kata sandi awal 123456.</p>${bad.length?`<p class="muted">${bad.length} baris dilewati:</p><ul>${bad.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="row"><button id="bt">Batal</button><button class="p" id="ok" ${ok.length?'':'disabled'}>Tambahkan</button></div>`);
 $('#bt').onclick=closeM;
 $('#ok').onclick=async()=>{const b=$('#ok'),gl=[];b.disabled=true;let n=0;
  for(const u of ok){b.textContent='Memproses '+(++n)+'/'+ok.length+'…';const {error}=await db.rpc('tambah_pengguna',{p_email:u.e,p_nama:u.n,p_role:u.ro});if(error)gl.push(u.e+': '+error.message)}
  await isiUsername();
  modal(`<h2>Impor Selesai</h2><p><b>${ok.length-gl.length}</b> pengguna berhasil ditambahkan.</p>${gl.length?`<p class="muted">${gl.length} gagal:</p><ul>${gl.slice(0,15).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="row"><button class="p" id="bt2">Tutup</button></div>`);
  $('#bt2').onclick=()=>{closeM();setelan()}};
}
boot();
</script></body></html>
