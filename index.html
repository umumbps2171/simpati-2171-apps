<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2147">
<title>Persuratan BPS Kota Batam</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#0f1b33;--mut:#66758f;--navy:#0b2a5b;--sky:#12408f;--sky2:#e8eef9;--bd:#e3e9f3;--err:#d92d20;--up:#0f9d58;--sh:0 1px 2px rgba(16,40,90,.06),0 6px 18px rgba(16,40,90,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1424;--card:#121f36;--tx:#e8eef7;--mut:#93a5c1;--navy:#9cc8f7;--sky:#4c9bf5;--sky2:#17294a;--bd:#223a5c;--err:#ff8a80;--up:#3ddc97;--sh:none}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
h1{margin:0;font-size:26px;letter-spacing:-.02em}h2{margin:0;font-size:17px}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:10px;font-weight:600;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}
button.p{background:linear-gradient(135deg,#17428f,#0a2147);border-color:transparent;color:#fff}
@media(prefers-color-scheme:dark){button.p{background:linear-gradient(135deg,#2a5fc0,#1a4398)}}
button.d{color:var(--err)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px;color:var(--mut)}
.muted{color:var(--mut)}
#login{max-width:380px;margin:12vh auto;padding:28px;background:var(--card);box-shadow:var(--sh);border-radius:18px}
#login h1{font-size:22px;margin-bottom:4px}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,#12397a,#0a2147);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav b{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-size:15px;line-height:1.25}
nav b i{width:36px;height:36px;border-radius:11px;background:#fff;color:#0f2f66;display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#dcebff;cursor:pointer;font-weight:600}
nav a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a:hover{background:rgba(255,255,255,.14)}
nav a.on{background:#fff;color:#0f2f66}
nav .sp{flex:1}nav small{padding:0 12px;color:#d6e8ff}
main{padding:28px 32px;min-width:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.bar input{max-width:300px;border-radius:99px;padding-left:16px}.bar .sp{flex:1}
.yr{display:flex;gap:8px;margin:14px 0}
.yr button{padding:5px 14px;border-radius:99px;font-size:13px}
.yr button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 16px}
.card,.pn,.set{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.card{padding:16px 18px}
.ch{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600;font-size:14px}
.ch i,.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cn{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:4px 0 8px}
.cf{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(15,157,88,.12);color:var(--up)}
.chip.dn{background:rgba(217,45,32,.12);color:var(--err)}.chip small{font-weight:500;opacity:.8}
.pn{padding:18px 20px;margin:14px 0}
.dg{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:14px 0}.dg .pn{margin:0;min-width:0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.sg .set{max-width:none;margin:16px 0 0}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 6px;font-size:13px;color:var(--mut)}.lg span{display:flex;align-items:center;gap:6px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.lt{flex:1;min-width:0;display:flex;flex-direction:column}.lt span{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--sky2);color:var(--sky);font-size:13px;white-space:nowrap}
tbody tr:hover td{background:var(--sky2)}
td.tg{cursor:cell;white-space:nowrap}td a{color:var(--sky);font-weight:600}
td.ac{white-space:nowrap}td.ac button{padding:4px 10px;font-size:13px}
.pgn{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.set{padding:18px;margin:16px 0;max-width:560px}
@media(max-width:1000px){.dg{grid-template-columns:1fr}}.set h2{font-size:17px}
#modal{position:fixed;inset:0;background:rgba(8,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f2f66;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--err)}
.empty{padding:36px;text-align:center;color:var(--mut)}
@media(max-width:800px){
 #app{display:block;padding-bottom:84px}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:2px;z-index:10;border-radius:18px 18px 0 0}
 nav b,nav .sp,nav small,nav .out{display:none}
 nav a{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:11px;text-align:center;border-radius:12px}
 main{padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px}h1{font-size:22px}
 .dg,.sg{grid-template-columns:1fr}
 .tw{background:none;box-shadow:none;overflow:visible}
 table,tbody,tr,td{display:block;min-width:0}tr:has(th){display:none}
 tr{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:8px 14px;margin-bottom:10px}
 td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:14px;text-align:right}
 td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left;flex:none}
 td.ac::before,td.empty::before{content:none}td.ac{justify-content:flex-end;padding-top:8px}
 tbody tr:hover td{background:none}
}
</style></head><body>

<form id="login" hidden>
 <h1>Persuratan BPS Kota Batam</h1><p class="muted">Masuk dengan akun yang diberikan administrator.</p>
 <label for="em">Email</label><input id="em" type="email" required autocomplete="username">
 <label for="pw">Kata sandi</label><input id="pw" type="password" required autocomplete="current-password">
 <div class="row"><button class="p" type="submit">Masuk</button></div>
</form>

<div id="app" hidden>
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<div id="modal" hidden></div><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ISI DUA BARIS INI (Supabase > Project Settings > API) =====
const SB_URL='https://gqxmaebmujswfurhiijc.supabase.co/rest/v1/', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxeG1hZWJtdWpzd2Z1cmhpaWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNjI3OTAsImV4cCI6MjExMDczODc5MH0.IVr2qpyLTH0Zc07xmz3v2mfzJ2MUutVCrOjKhqXy1h4';
// =================================================================
const db=supabase.createClient(new URL(SB_URL.trim()).origin,SB_KEY.trim());
const J={
 surat_keluar:{t:'Surat Keluar',f:['tanggal','klasifikasi','perihal','tujuan','link'],c:['nomor','pembuat','tanggal','perihal','tujuan','link']},
 surat_tugas:{t:'Surat Tugas',f:['tanggal','klasifikasi','perihal','tujuan','link'],c:['nomor','pembuat','tanggal','perihal','tujuan','link']},
 sk_kpa:{t:'SK KPA',f:['tanggal','output','uraian'],c:['tanggal','nomor','output','uraian']}};
const LB={nomor:'Nomor',pembuat:'Nama Pegawai Pembuat',tanggal:'Tanggal Surat',klasifikasi:'Kode Klasifikasi',perihal:'Perihal',tujuan:'Tujuan',link:'Link Surat (Google Drive)',output:'Output',uraian:'Uraian SK'};
const sv=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
const IC={dashboard:sv('<path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>'),
 surat_keluar:sv('<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>'),
 surat_tugas:sv('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>'),
 sk_kpa:sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/>'),
 pengaturan:sv('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>')};
let me=null,view='dashboard',rows=[],page=1,q='',pg=[],kl=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const canEdit=()=>['admin','petugas'].includes(me.role);
const tgl=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'';
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err show':'show';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3500)}
function modal(h){const m=$('#modal');m.innerHTML='<div class="box">'+h+'</div>';m.hidden=false}
function closeM(){$('#modal').hidden=true}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};

async function boot(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){$('#app').hidden=true;$('#login').hidden=false;return}
 const {data:p}=await db.from('profiles').select('*').eq('id',session.user.id).single();
 me=p||{role:'pegawai',nama:session.user.email};
 const [a,b]=await Promise.all([db.from('pegawai').select('nama').eq('aktif',true).order('nama'),db.from('klasifikasi').select('*').order('kode')]);
 pg=a.data||[];kl=b.data||[];
 $('#login').hidden=true;$('#app').hidden=false;
 const ni=(v,t)=>`<a data-v="${v}">${IC[v]}<span>${t}</span></a>`;
 $('#nav').innerHTML='<b><i>P</i><span>Persuratan<br>BPS Kota Batam</span></b>'+ni('dashboard','Dashboard')+Object.keys(J).map(k=>ni(k,J[k].t)).join('')+ni('pengaturan','Pengaturan')+`<span class="sp"></span><small class="out">${esc(me.nama)} (${me.role})</small><a class="out" id="keluar"><span>Keluar</span></a>`;
 $('#nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;if(a.id=='keluar'){db.auth.signOut().then(()=>location.reload())}else go(a.dataset.v)};
 go('dashboard');
}
$('#login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error){const m=error.message||'';return toast(/Invalid login/i.test(m)?'Email atau kata sandi salah':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Di Supabase, buka Authentication > Users, lalu konfirmasi pengguna ini.':/api key/i.test(m)?'URL atau key Supabase di index.html belum benar':'Gagal masuk: '+m,1)}boot()};

function go(v){view=v;page=1;q='';document.querySelectorAll('#nav a[data-v]').forEach(a=>a.className=a.dataset.v==v?'on':'');v=='dashboard'?dash():v=='pengaturan'?setelan():load()}

let dy=0;
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],CL={surat_keluar:'#2a62c9',surat_tugas:'#12b5a6',sk_kpa:'#f5a524'},IN={surat_keluar:'SK',surat_tugas:'ST',sk_kpa:'KPA'};
function chart(m){
 const ks=Object.keys(J),top=Math.ceil(Math.max(4,...ks.flatMap(k=>m[k]))/4)*4,W=720,H=260,L=34,T=14,Bt=28,pw=(W-L)/12,bw=pw/4.2;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik jumlah nomor per bulan" style="width:100%;height:auto">`;
 for(let i=0;i<=4;i++){const y=T+(H-T-Bt)*(1-i/4);s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mut)">${top*i/4}</text>`}
 BL.forEach((b,i)=>{const x0=L+i*pw+pw/2-bw*1.5;ks.forEach((k,j)=>{const v=m[k][i],h=(H-T-Bt)*v/top;s+=`<rect x="${x0+j*bw}" y="${H-Bt-h}" width="${bw-1.5}" height="${h}" rx="3" fill="${CL[k]}"><title>${J[k].t} ${b}: ${v}</title></rect>`});
  s+=`<text x="${L+i*pw+pw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${b}</text>`});
 return s+'</svg>'}
function spark(a,c){const mx=Math.max(1,...a);return `<svg viewBox="0 0 80 28" width="80" height="28" aria-hidden="true"><polyline points="${a.map((v,i)=>(i*80/11).toFixed(1)+','+(26-v*24/mx).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
async function dash(){
 $('#main').innerHTML='<p class="muted">Memuat…</p>';
 const ks=Object.keys(J),[a,b]=await Promise.all([db.from('register').select('jenis,tahun,tanggal').limit(10000),
  db.from('register').select('jenis,nomor,perihal,uraian,tanggal').order('dibuat_pada',{ascending:false}).limit(6)]);
 const all=a.data||[],cy=new Date().getFullYear(),yrs=[...new Set([cy,...all.map(r=>r.tahun)])].sort((x,y)=>y-x).slice(0,4);
 if(!yrs.includes(dy))dy=cy;
 const m={};ks.forEach(k=>m[k]=Array(12).fill(0));
 all.filter(r=>r.tahun==dy).forEach(r=>m[r.jenis][+r.tanggal.slice(5,7)-1]++);
 const bi=new Date().getMonth(),first=(me.nama||'').split('@')[0].split(/[ ,]/)[0];
 $('#main').innerHTML=`<p class="muted" style="margin:0">Halo, ${esc(first)}</p><h1>Dashboard</h1>
 <div class="yr">${yrs.map(y=>`<button class="${y==dy?'on':''}" data-y="${y}">${y}</button>`).join('')}</div>
 <div class="cards">${ks.map(k=>{const t=m[k].reduce((x,y)=>x+y,0),d=dy==cy?m[k][bi]-(bi?m[k][bi-1]:0):null;
  return `<div class="card"><div class="ch"><i style="background:${CL[k]}"></i>${J[k].t}</div><div class="cn">${t}</div><div class="cf">${d===null?'<span class="muted">Total '+dy+'</span>':`<span class="chip ${d<0?'dn':''}">${d<0?'▼':'▲'} ${Math.abs(d)} <small>vs bulan lalu</small></span>`}${spark(m[k],CL[k])}</div></div>`}).join('')}</div>
 <div class="dg"><div class="pn"><h2>Nomor per bulan, ${dy}</h2><div class="lg">${ks.map(k=>`<span><i style="background:${CL[k]}"></i>${J[k].t}</span>`).join('')}</div>${chart(m)}</div>
 <div class="pn"><h2>Nomor terbaru</h2>${(b.data||[]).map(r=>`<div class="li"><div class="av" style="background:${CL[r.jenis]}">${IN[r.jenis]}</div><div class="lt"><b>${esc(r.nomor)}</b><span>${esc(r.perihal||r.uraian)}</span></div><small class="muted">${tgl(r.tanggal)}</small></div>`).join('')||'<p class="empty">Belum ada nomor yang diambil.</p>'}</div></div>`;
 $('#main').querySelectorAll('[data-y]').forEach(x=>x.onclick=()=>{dy=+x.dataset.y;dash()});
}
async function load(){
 $('#main').innerHTML='<p class="muted">Memuat…</p>';
 const {data,error}=await db.from('register').select('*').eq('jenis',view).order('tahun',{ascending:false}).order('urut',{ascending:false}).order('sisipan',{ascending:false}).limit(5000);
 if(error)return toast('Gagal memuat data: '+error.message,1);
 rows=data;draw();
}
function draw(){
 const J1=J[view],s=q.toLowerCase(),f=rows.filter(r=>!s||Object.values(r).join(' ').toLowerCase().includes(s));
 const tp=Math.max(1,Math.ceil(f.length/10));page=Math.min(page,tp);
 const part=f.slice((page-1)*10,page*10),ed=canEdit(),ad=me.role=='admin';
 const cell=(r,k)=>{const l=`data-l="${LB[k]}"`;return k=='tanggal'?`<td class="tg" ${l} ${ed?`data-id="${r.id}" title="Klik dua kali untuk ubah tanggal"`:''}>${tgl(r.tanggal)}</td>`:
  k=='link'?`<td ${l}>${/^https?:\/\//.test(r.link||'')?`<a href="${esc(r.link)}" target="_blank" rel="noopener">Buka</a>`:''}</td>`:
  k=='nomor'?`<td ${l}><b>${esc(r.nomor)}</b></td>`:`<td ${l}>${esc(r[k])}</td>`};
 $('#main').innerHTML=`<h1>${J1.t}</h1><div class="bar"><input id="cari" type="search" placeholder="Cari nomor, perihal, tujuan…" value="${esc(q)}"><span class="sp"></span><button id="exp">Ekspor Excel</button><button class="p" id="tambah">Ambil nomor baru</button></div>
 <div class="tw"><table><tr>${J1.c.map(k=>`<th>${LB[k]}</th>`).join('')}${ed?'<th>Aksi</th>':''}</tr>
 ${part.map(r=>`<tr>${J1.c.map(k=>cell(r,k)).join('')}${ed?`<td class="ac"><button data-e="${r.id}">Ubah</button> ${ad?`<button class="d" data-x="${r.id}">Hapus</button>`:''}</td>`:''}</tr>`).join('')||`<tr><td colspan="9" class="empty">${s?'Tidak ada data yang cocok dengan pencarian.':'Belum ada data. Klik “Ambil nomor baru” untuk memulai.'}</td></tr>`}</table></div>
 <div class="pgn"><span class="muted">${f.length} data</span><button id="pv" ${page<2?'disabled':''}>Sebelumnya</button><span>${page} / ${tp}</span><button id="nx" ${page>=tp?'disabled':''}>Berikutnya</button></div>`;
 $('#cari').oninput=e=>{q=e.target.value;page=1;draw();const i=$('#cari');i.focus();i.setSelectionRange(q.length,q.length)};
 $('#tambah').onclick=()=>form();$('#exp').onclick=exportCsv;
 $('#pv').onclick=()=>{page--;draw()};$('#nx').onclick=()=>{page++;draw()};
 $('#main').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(b.dataset.e));
 $('#main').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>hapus(b.dataset.x));
 $('#main').querySelectorAll('td.tg[data-id]').forEach(td=>td.ondblclick=()=>editTgl(td));
}
function editTgl(td){
 const r=rows.find(x=>x.id==td.dataset.id),i=document.createElement('input');i.type='date';i.value=r.tanggal;td.innerHTML='';td.appendChild(i);i.focus();
 const simpan=async()=>{if(!i.value||i.value==r.tanggal)return draw();
  if(+i.value.slice(0,4)!=r.tahun){toast('Tahun harus sama dengan tahun pada nomor ('+r.tahun+')',1);return draw()}
  const {error}=await db.from('register').update({tanggal:i.value}).eq('id',r.id);
  if(error)toast('Gagal menyimpan: '+error.message,1);else{r.tanggal=i.value;toast('Tanggal diperbarui')}draw()};
 i.onblur=simpan;i.onkeydown=e=>{if(e.key=='Enter')i.blur();if(e.key=='Escape'){i.onblur=null;draw()}};
}
function fld(k,v){v=v??'';
 if(k=='pembuat')return `<select name="pembuat"><option value="">- pilih pegawai -</option>${pg.map(p=>`<option ${p.nama==v?'selected':''}>${esc(p.nama)}</option>`).join('')}</select>`;
 if(k=='klasifikasi')return `<input name="klasifikasi" list="kl" value="${esc(v)}" placeholder="Ketik kode, mis. VS.330" autocomplete="off" required>`;
 return `<input name="${k}" type="${k=='tanggal'?'date':k=='link'?'url':'text'}" value="${esc(v)}" ${k=='tanggal'?'required':''}>`}
function form(id){
 const r=id?rows.find(x=>x.id==id):{tanggal:new Date().toISOString().slice(0,10)};
 const f=J[view].f.filter(k=>!(id&&k=='klasifikasi'));
 modal(`<h2>${id?'Ubah':'Ambil nomor'} ${J[view].t}</h2><form id="fm">${id?`<label>Nomor</label><input value="${esc(r.nomor)}" disabled>`:''}
 ${f.map(k=>`<label>${LB[k]}</label>${fld(k,r[k])}`).join('')}
 ${!id?'<p id="hint" class="muted" style="font-size:13px;margin:12px 0 0"></p>':''}
 <datalist id="kl">${kl.map(k=>`<option value="${esc(k.kode)}">${esc(k.uraian)}</option>`).join('')}</datalist>
 <div class="row"><button type="button" id="bt">Batal</button><button class="p" type="submit">${id?'Simpan perubahan':'Simpan dan ambil nomor'}</button></div></form>`);
 $('#bt').onclick=closeM;$('#fm').onsubmit=e=>save(e,id);
 if(!id){const t=$('#fm [name=tanggal]'),hn=()=>{const y=t.value.slice(0,4),m=rows.filter(x=>String(x.tahun)==y).reduce((a,x)=>x.tanggal>a?x.tanggal:a,'');
  $('#hint').textContent=t.value&&m&&t.value<m?'Tanggal lebih awal dari nomor terakhir ('+tgl(m)+'): sistem otomatis memberi nomor sisipan (A, B, …).':'Nomor diberikan otomatis. Pembuat: '+me.nama};t.onchange=hn;hn()}
}
async function save(e,id){
 e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 for(const k in d)if(d[k]==='')d[k]=null;
 const btn=e.submitter;btn.disabled=true;
 if(id){
  const o=rows.find(x=>x.id==id);
  if(+d.tanggal.slice(0,4)!=o.tahun){btn.disabled=false;return toast('Tahun harus sama dengan tahun pada nomor ('+o.tahun+')',1)}
  const {error}=await db.from('register').update(d).eq('id',id);
  btn.disabled=false;if(error)return toast('Gagal menyimpan: '+error.message,1);
  closeM();toast('Perubahan disimpan');return load();
 }
 const {data,error}=await db.rpc('ambil_nomor',{p_jenis:view,p_tanggal:d.tanggal,p_perihal:d.perihal??null,p_tujuan:d.tujuan??null,p_klas:d.klasifikasi??null,p_link:d.link??null,p_output:d.output??null,p_uraian:d.uraian??null});
 btn.disabled=false;
 if(error)return toast(/foreign key/.test(error.message)?'Kode klasifikasi tidak ada dalam daftar':error.message,1);
 try{await navigator.clipboard.writeText(data.nomor)}catch(_){}
 closeM();toast('Nomor: '+data.nomor+' (sudah disalin)');load();
}
function hapus(id){
 const r=rows.find(x=>x.id==id);
 modal(`<h2>Hapus data?</h2><p>Nomor <b>${esc(r.nomor)}</b> akan dihapus dan tercatat di audit log. Nomor ini tidak akan dipakai ulang.</p><div class="row"><button id="bt">Batal</button><button class="p" id="ok">Hapus</button></div>`);
 $('#bt').onclick=closeM;
 $('#ok').onclick=async()=>{const {error}=await db.from('register').delete().eq('id',id);closeM();error?toast('Gagal menghapus: '+error.message,1):(toast('Data dihapus'),load())};
}
function exportCsv(){
 const c=J[view].c,l=l=>'"'+String(l??'').replace(/"/g,'""')+'"';
 const t='\ufeff'+[c.map(k=>l(LB[k])).join(';'),...rows.map(r=>c.map(k=>l(r[k])).join(';'))].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));
 a.download=view+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
async function setelan(){
 const ad=me.role=='admin';let us=[];
 if(ad){const {data}=await db.from('profiles').select('*').order('email');us=data||[]}
 $('#main').innerHTML=`<h1>Pengaturan</h1>
 <div class="sg"><div class="set"><h2>Ubah kata sandi saya</h2><label>Kata sandi baru (minimal 6 karakter)</label><input id="np" type="password" autocomplete="new-password"><div class="row"><button class="p" id="gp">Simpan kata sandi</button></div></div>
 ${ad?`<div class="set"><h2>Tambah pengguna</h2><p class="muted">Kata sandi awal: <b>123456</b>. Minta pengguna menggantinya setelah masuk pertama kali.</p>
 <label>Email (Gmail)</label><input id="ue" type="email" placeholder="nama@gmail.com">
 <label>Nama pegawai</label><select id="un"><option value="">- pilih pegawai -</option>${pg.map(p=>`<option>${esc(p.nama)}</option>`).join('')}</select>
 <label>Peran</label><select id="ur"><option value="pegawai">Pegawai</option><option value="petugas">Petugas Persuratan</option><option value="admin">Administrator</option></select>
 <div class="row"><button class="p" id="tp">Tambah pengguna</button></div></div></div>
 <h2 style="font-size:17px;margin:22px 0 10px">Daftar pengguna</h2><div class="tw"><table><tr><th>Email</th><th>Nama pegawai (pembuat)</th><th>Peran</th><th>Aksi</th></tr>${us.map(u=>`<tr><td>${esc(u.email)}</td><td><select data-n="${u.id}"><option>${esc(u.nama)}</option>${pg.filter(p=>p.nama!=u.nama).map(p=>`<option>${esc(p.nama)}</option>`).join('')}</select></td><td><select data-r="${u.id}">${['pegawai','petugas','admin'].map(r=>`<option value="${r}" ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td><td class="ac"><button data-rs="${u.id}" data-em="${esc(u.email)}">Reset kata sandi</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pengguna.</td></tr>'}</table></div>`:'</div>'}`;
 $('#gp').onclick=async()=>{const v=$('#np').value;if(v.length<6)return toast('Kata sandi minimal 6 karakter',1);const {error}=await db.auth.updateUser({password:v});error?toast('Gagal: '+error.message,1):(toast('Kata sandi diperbarui'),$('#np').value='')};
 if(!ad)return;
 $('#tp').onclick=async()=>{const e=$('#ue').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Email tidak valid',1);
  const {error}=await db.rpc('tambah_pengguna',{p_email:e,p_nama:$('#un').value,p_role:$('#ur').value});
  if(error)return toast(error.message,1);toast('Pengguna ditambahkan. Kata sandi awal: 123456');setelan()};
 $('#main').querySelectorAll('[data-r]').forEach(s=>s.onchange=async()=>{const {error}=await db.rpc('ubah_peran',{p_id:s.dataset.r,p_role:s.value});error?(toast(error.message,1),setelan()):toast('Peran diperbarui')});
 $('#main').querySelectorAll('[data-n]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('profiles').update({nama:s.value}).eq('id',s.dataset.n);error?toast(error.message,1):toast('Nama pegawai diperbarui')});
 $('#main').querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{
  modal(`<h2>Reset kata sandi?</h2><p>Kata sandi <b>${esc(b.dataset.em)}</b> akan dikembalikan ke 123456.</p><div class="row"><button id="bt">Batal</button><button class="p" id="ok">Reset</button></div>`);
  $('#bt').onclick=closeM;
  $('#ok').onclick=async()=>{const {error}=await db.rpc('reset_sandi',{p_id:b.dataset.rs});closeM();error?toast(error.message,1):toast('Kata sandi dikembalikan ke 123456')}});
}
boot();
</script></body></html>
